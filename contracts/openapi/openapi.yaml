openapi: 3.1.0
info:
  title: Factory Knowledge Hub · knowledge-api
  version: 0.1.0
  description: |
    受控知识治理与可引用 RAG 服务契约（L1 Rev.2 §6.2 / §13.5）。

    通用约束：
    - 所有端点要求 `Authorization: Bearer <OIDC JWT>`，服务端校验 issuer / audience / exp / 签名。
    - `tenant_id`、`principal_id`、`roles` 只从令牌解析，不接受请求体或查询参数覆盖。
    - 写接口要求 `Idempotency-Key`；并发更新使用 `If-Match` 携带版本号。
    - 403 不区分"资源不存在"与"无权限"，避免用于探测资源存在性。
    - 所有错误响应统一为 Error 结构，并携带 trace_id。

    实现状态（Phase 0）：健康探针与认证已可用；业务端点已注册但返回 501，
    检索链路在 Phase 2、培训问答在 Phase 3 接入。
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: health
  - name: knowledge
  - name: evidence
  - name: training
  - name: ops
paths:
  /health/live:
    get:
      tags: [health]
      summary: 存活探针
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string }
                  version: { type: string }
  /health/ready:
    get:
      tags: [health]
      summary: 依赖就绪探针
      security: []
      responses:
        "200":
          description: 依赖就绪
        "503":
          description: 依赖未就绪（数据库未配置或不可达）

  /v1/sources:
    post:
      tags: [ops]
      summary: 申请上传与导入
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_type, filename, sha256]
              properties:
                source_type: { type: string, enum: [document, audio] }
                filename: { type: string, minLength: 1 }
                sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                expected_domain:
                  type: string
                  enum: [owner_experience, glass_materials, production_process, product_catalog, quality, equipment_safety, foreign_trade, training]
      responses:
        "201": { description: 已创建上传凭据 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /v1/interviews:
    post:
      tags: [knowledge]
      summary: 建立语音访谈任务
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [interviewee_subject, consent_record_id]
              properties:
                interviewee_subject: { type: string }
                consent_record_id: { type: string }
                topic: { type: string }
      responses:
        "201": { description: 访谈任务已建立 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /v1/interviews/{interview_id}:
    get:
      tags: [knowledge]
      summary: 查询转写与草稿状态
      parameters:
        - name: interview_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: 转写与草稿状态 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /v1/knowledge/drafts:
    post:
      tags: [knowledge]
      summary: 创建知识草稿
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [knowledge_key, domain, title, classification, audience]
              properties:
                knowledge_key: { type: string }
                domain:
                  type: string
                  enum: [owner_experience, glass_materials, production_process, product_catalog, quality, equipment_safety, foreign_trade, training]
                title: { type: string }
                classification: { type: integer, minimum: 0, maximum: 4 }
                audience: { type: string, enum: [internal, customer_public] }
      responses:
        "201": { description: 草稿已创建 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  # 注意：旧路径参数名为 knowledge_id，但**实际接收 version_id**（历史命名，本片不改）
  /v1/knowledge/{knowledge_id}/review:
    post:
      tags: [knowledge]
      summary: 技术审核
      description: |
        PASS 提交审核（DRAFT→REVIEWED）；APPROVE_INTERNAL 批准内部可用（REVIEWED→APPROVED_INTERNAL）；
        REJECT 退回草稿（REVIEWED/APPROVED_INTERNAL→DRAFT，同时清空审批人）。
        作废走独立端点 `/v1/knowledge/{knowledge_id}/discard`（RAW/DRAFT/REVIEWED/APPROVED_INTERNAL→DISCARDED）。
      parameters:
        - $ref: "#/components/parameters/KnowledgeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [PASS, REJECT, APPROVE_INTERNAL] }
                reason: { type: [string, "null"], maxLength: 500 }
      responses:
        "200": { description: 审核结果与新状态 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 当前状态不允许该操作 }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/knowledge/{knowledge_id}/publish:
    post:
      tags: [knowledge]
      summary: 内部或对外发布
      description: |
        audience=internal：REVIEWED→APPROVED_INTERNAL；已批准则为幂等操作。
        audience=customer_public：需要 knowledge.publish_public 权限，要求 C0 + customer_public，
        且公开审批人必须区别于技术审批人——审批人取自令牌，请求体无法指定。
      parameters:
        - $ref: "#/components/parameters/KnowledgeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [audience]
              properties:
                audience: { type: string, enum: [internal, customer_public] }
                reason: { type: [string, "null"], maxLength: 500 }
      responses:
        "200": { description: 发布结果与新状态 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 状态不符或双签主体相同 }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/knowledge/{knowledge_id}/revoke:
    post:
      tags: [knowledge]
      summary: 同步撤销授权与发布
      description: 撤销立即生效：状态一改，后续读取即拒绝该版本，不等索引异步清理。
      parameters:
        - $ref: "#/components/parameters/KnowledgeId"
        - name: reason
          in: query
          required: false
          schema: { type: string, maxLength: 500 }
      responses:
        "200": { description: 已撤销 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 版本已撤销或状态不允许撤销 }

  /v1/knowledge/{knowledge_id}/discard:
    post:
      tags: [knowledge]
      summary: 作废未对外发布的版本
      description: >-
        把从未对外发布的版本作废（DISCARDED）：允许 RAW / DRAFT / REVIEWED / APPROVED_INTERNAL；
        PUBLISHED_PUBLIC / SUPERSEDED 不允许（曾对外可见，须走撤销）。弃用立即生效，
        后续检索与证据端点不再返回该版本。同一版本重复弃用为幂等操作，不产生新的审计与事件。
        权限沿用 knowledge.revoke（弃用只收回可用性，不授予发布资格）。
      parameters:
        - $ref: "#/components/parameters/KnowledgeId"
        - name: reason
          in: query
          required: false
          schema: { type: string, maxLength: 500 }
      responses:
        "200": { description: 已作废（重复请求同样返回 200） }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 当前状态不允许作废（曾发布或已终止） }

  /v1/knowledge/search:
    post:
      tags: [knowledge]
      summary: 权限过滤检索
      description: >-
        默认词法检索（cjk-char-v1 字级 **OR** 召回 + ts_rank_cd 排序；2026-11-04 起查询构造
        由逐字 AND 改为 OR，同一评测集 recall@10 从 0.06 提升到 0.68）；服务端可用
        FKH_RETRIEVAL_MODE=hybrid 启用「向量 + 词法 RRF 融合」（向量由本地 BGE-M3 生成，
        不调用任何外部服务），召回模式不是请求参数，客户端只能从响应 scoring 观察。
        scoring 取值集合为 lexical-v3 | lexical-v2 | hybrid-rrf-v1（lexical-v1 为 2026-11-04 之前的历史取值，
        不再返回）：按旧 const 校验的调用方必须放宽断言——这是**有意的破坏性契约变更**。
        max_results 是返回上限，不保证填满：候选窗口内被 ACL 拒绝的条数越多，返回越少。
        空结果与「都无权限」不可区分（同为 200 + 空数组），但缺少接口权限或范围未授权仍返回 403。
        显式启用混合但模型未安装/权重缺失/推理失败时返回 503，不静默降级成词法结果。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query, knowledge_scope]
              properties:
                query: { type: string, minLength: 1, maxLength: 2000 }
                knowledge_scope: { type: string, enum: [customer_public, internal_training, internal_product] }
                max_results: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: 已按 ACL 过滤的候选片段
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/knowledge/context:
    post:
      tags: [knowledge]
      summary: 检索并组装生成用上下文（内部端点）
      description: |
        问答链路的前置步骤，不对外承诺。
        每一块都经过 ACL 判定；父块仅在其下全部子块均可见时整段返回，否则退回子块原文。
        必须经过检索审计，权限与 /v1/knowledge/search 相同。
        召回来源**固定为词法**（2026-11-04 判决 Q7）：候选来源变化会改变拒答分档
        （NO_EVIDENCE / INSUFFICIENT_EVIDENCE / HUMAN_REVIEW_REQUIRED / UNSUPPORTED_CLAIM），
        即使 search 已启用混合，本端点也不跟随；接混合须另行送审。
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query, knowledge_scope]
              properties:
                query: { type: string, minLength: 1, maxLength: 2000 }
                knowledge_scope:
                  type: string
                  enum: [customer_public, internal_training, internal_product]
                max_results: { type: integer, minimum: 1, maximum: 50, default: 10 }
                max_blocks: { type: integer, minimum: 1, maximum: 20, default: 8 }
                max_tokens: { type: integer, minimum: 500, maximum: 20000, default: 6000 }
      responses:
        "200": { description: 上下文块与统计（denied / dropped / parent_restores） }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { description: 检索审计未配置 }

  /v1/knowledge/answer:
    post:
      tags: [knowledge]
      summary: 带引用问答
      description: >-
        检索 → 本地推理 → 引用白名单核验 → 状态判定。ADR-04 未签署期间只允许本地推理
        （Ollama，loopback）；未配置或被拒时返回 503 并记 `ERROR` 审计，不伪装成拒答。
        `ANSWERED` 至少有 1 条引用，且每条实质性结论都必须带引用；否则返回
        `REFUSED`（`INSUFFICIENT_EVIDENCE`，需人工复核）、`HUMAN_REVIEW_REQUIRED`（出现伪造引用），
        或 `HUMAN_REVIEW_REQUIRED` + `UNSUPPORTED_CLAIM`（答案里的货号/带单位数值未被引用证据支持）。
        审计只保存 query 的 HMAC 摘要，不落明文。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schema/answer_request.json"
      responses:
        "200":
          description: 回答、拒答或转人工
          content:
            application/json:
              schema:
                $ref: "../schema/answer_response.json"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/evidence/{evidence_id}:
    get:
      tags: [evidence]
      summary: 受控证据定位
      description: >-
        返回受控证据的定位与正文。ADR-01 未签署、无对象存储，本版本固定返回
        signed_url=null 与 signed_url_state=NOT_CONFIGURED：定位能力可用，签名链接能力未交付。
        不存在、跨租户、状态不可见、scope 不符、ACL 拒绝一律 403，body 不携带资源元数据。
      parameters:
        - name: evidence_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 证据定位与正文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/feedback:
    post:
      tags: [knowledge]
      summary: 反馈与坏例登记
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [trace_id, category, expected_behavior]
              properties:
                trace_id: { type: string, minLength: 1, maxLength: 128 }
                category: { type: string, minLength: 1, maxLength: 64 }
                expected_behavior:
                  type: object
                  additionalProperties: false
                  required: [expected_status]
                  properties:
                    expected_status:
                      type: string
                      enum: [ANSWERED, REFUSED, HUMAN_REVIEW_REQUIRED]
                    must_cite:
                      type: boolean
                      default: false
      responses:
        "201": { description: 已登记坏例 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: trace_id 不存在或不属于当前租户 }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/training/courses:
    post:
      tags: [training]
      summary: 创建课程草稿
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role_code, role_name, title]
              properties:
                role_code: { type: string, minLength: 1, maxLength: 64 }
                role_name: { type: string, minLength: 1, maxLength: 128 }
                title: { type: string, minLength: 1, maxLength: 200 }
                knowledge_version_ids:
                  type: array
                  maxItems: 20
                  items: { type: string }
      responses:
        "200": { description: 课程草稿（status=DRAFT） }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 业务规则不满足 }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/training/courses/{course_id}/questions:
    post:
      tags: [training]
      summary: 新增题目（内部端点）
      description: 题目绑定创建时的课程版本；同一版本内题目不可变。
      x-internal: true
      parameters:
        - name: course_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question_type, prompt]
              properties:
                question_type:
                  type: string
                  enum: [SINGLE_CHOICE, MULTI_CHOICE, TRUE_FALSE, SHORT_ANSWER]
                prompt: { type: string, minLength: 1, maxLength: 1000 }
                answer_key: { type: object }
                evidence_refs:
                  type: array
                  maxItems: 10
                  items: { type: object }
                status: { type: string, enum: [DRAFT, APPROVED], default: APPROVED }
      responses:
        "200": { description: 题目已创建 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 课程不存在或状态不允许 }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/training/courses/{course_id}/publish:
    post:
      tags: [training]
      summary: 发布课程
      description: |
        必须绑定至少一个已审批知识版本（数据库触发器强制）；存在草稿题目时拒绝。
        发布时 version 自增、published_at 由数据库填写。
      parameters:
        - name: course_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: 已发布 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 缺少知识源、源未审批或存在草稿题目 }
  /v1/training/assignments:
    post:
      tags: [training]
      summary: 按岗位分配课程
      description: 只有已发布课程可分配；同一课程对同一学员重复分配返回既有任务。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [course_id, learner_subject_id]
              properties:
                course_id: { type: string }
                learner_subject_id: { type: string, minLength: 1, maxLength: 200 }
                cohort_id: { type: [string, "null"], maxLength: 64 }
      responses:
        "200": { description: 分配结果 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 课程未发布或不存在 }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/training/me/assignments:
    get:
      tags: [training]
      summary: 查询本人学习任务
      description: 学员身份取自令牌，不接受查询参数指定他人。
      responses:
        "200": { description: 本人任务列表 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/training/ask:
    post:
      tags: [training]
      summary: 培训带引用问答
      description: 服务端由 assignment 反查租户、课程版本与知识白名单，不接受请求自带权限字段。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assignment_id, question, language]
              properties:
                assignment_id: { type: string }
                question: { type: string, minLength: 1, maxLength: 2000 }
                language: { type: string, enum: [zh-CN, en-US] }
      responses:
        "200":
          description: 回答，结构同 AnswerResponse 并附带 assignment_id 与 course_version
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [status, answer, citations, trace_id, assignment_id, course_version]
                properties:
                  assignment_id: { type: string }
                  course_version: { type: integer, minimum: 1 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /v1/training/attempts:
    post:
      tags: [training]
      summary: 提交测验
      description: |
        服务端按已审批题库版本判分，请求体不含分数字段（多传即 422）。
        幂等键重复提交返回既有成绩，不重复判分。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assignment_id, responses, idempotency_key]
              properties:
                assignment_id: { type: string }
                responses: { type: object }
                idempotency_key: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200": { description: 判分结果 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 非本人任务或任务不存在 }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/training/practical-signoffs:
    post:
      tags: [training]
      summary: 人工实操签核
      description: 校验导师与班组授权；签核人不得是当前学员本人。
      responses:
        "201": { description: 已签核 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /v1/training/feedback:
    post:
      tags: [training]
      summary: 形成受控坏例及课程反馈
      responses:
        "201": { description: 已登记 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /v1/training/assignments/{assignment_id}/progress:
    get:
      tags: [training]
      summary: 学习进度
      description: 只能查本人任务；他人任务与不存在同样返回 403。
      parameters:
        - name: assignment_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: 进度详情 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/catalog/conflicts:
    get:
      tags: [catalog]
      summary: 目录冲突待办列表
      description: >-
        需要 `catalog.read`。只返回调用者可见的组：版本须处于可操作状态（RAW/DRAFT/REVIEWED/
        APPROVED_INTERNAL/PUBLISHED_PUBLIC）、`required_scope` 在令牌授权范围内、且 ACL 允许；
        **过滤发生在计数与分页之前**，`total` 是过滤后的可见数量。
        不存在、跨租户、scope 不符、ACL 拒绝在决议接口一律 404；列表只做剔除。
        响应不含原文整行（只给 spec / raw_price / locator）。
        排序为 `code ASC, group_id ASC`（code 不唯一，必须补唯一键）。
      security: [{bearerAuth: []}]
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [OPEN, KEEP, DROP_ALL], default: OPEN}
        - name: code
          in: query
          schema: {type: string}
          description: 货号精确匹配
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: 过滤后的待办组
          content:
            application/json:
              schema:
                $ref: "../schema/catalog_conflict_list.json"
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /v1/catalog/conflicts/{group_id}/resolve:
    post:
      tags: [catalog]
      summary: 对目录冲突待办做决议（KEEP / DROP_ALL）
      description: >-
        需要 `catalog.read` + `catalog.resolve`。操作者取自令牌，服务端复核「该租户 / 活跃 / user 主体」，
        请求体没有 actor 字段。决议与回填在同一事务：锁组 → 校验 OPEN → 校验候选归属 →
        回填条目 → 落决议；**一次性，不支持原地改判**（错判走新版本）。
        不存在 / 跨租户 / scope 不符 / ACL 拒绝 → 404，错误体不透露原因；
        缺 scope、非 user 主体、已停用 → 403；已决议或版本已撤销/弃用/被替代 → 409（第二次不更新任何字段）；
        KEEP 未给候选、候选不属于该组、DROP_ALL 携带 candidate_id（含显式 null）→ 422。
      security: [{bearerAuth: []}]
      parameters:
        - name: group_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: {type: string, enum: [KEEP, DROP_ALL]}
                candidate_id: {type: string, description: KEEP 必填；DROP_ALL 不得出现}
                note: {type: [string, "null"], maxLength: 500}
      responses:
        "200":
          description: 决议后的组
          content:
            application/json:
              schema:
                $ref: "../schema/catalog_conflict_group.json"
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: 不存在、跨租户、scope 不符或 ACL 拒绝（不可区分）
          content:
            application/json:
              schema: {$ref: "../schema/error.json"}
        "409":
          description: 已决议，或版本已撤销/弃用/被替代
          content:
            application/json:
              schema: {$ref: "../schema/error.json"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /v1/knowledge/documents:
    post:
      tags: [knowledge]
      summary: 上传文档并入库（初始 DRAFT）
      description: >-
        需要 `knowledge.ingest`，并单独校验数据范围（`required_scope` 必须在令牌 allowed_scopes 内）。
        请求的 ACL 必须允许调用者本人（不能创建自己读不到的内容）。
        传输为 JSON + base64：解码后正文 ≤ 5 MiB，HTTP 请求体上限 8 MiB（超出 413 `PAYLOAD_TOO_LARGE`），
        base64 非法或正文为空 422。`knowledge_key` 在同租户内唯一，重复 → 409（不覆盖、不新建版本；
        首次成功但响应丢失后重试同样 409，本接口不提供"重试返回原结果"的幂等语义）。
        入库状态固定为 `DRAFT`，请求不能指定初始状态，也不能跳过审核；
        `product_catalog` 域仍会触发目录抽取，抽取警告通过 `warnings` 返回。
        失败不留半成品（文档/版本/切片/ACL/目录条目/冲突待办同事务）。
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [filename, title, domain, owner_department, required_scope, knowledge_key, content_base64]
              properties:
                filename: {type: string, minLength: 1, maxLength: 200}
                title: {type: string, minLength: 1, maxLength: 200}
                domain:
                  type: string
                  enum: [owner_experience, glass_materials, production_process, product_catalog,
                         quality, equipment_safety, foreign_trade, training]
                owner_department: {type: string, minLength: 1, maxLength: 100}
                classification: {type: integer, minimum: 0, maximum: 4, default: 2}
                audience: {type: string, enum: [internal, customer_public], default: internal}
                required_scope:
                  type: string
                  enum: [internal_product, internal_training, customer_public]
                acl_allow_roles: {type: array, items: {type: string}, maxItems: 20}
                acl_deny_roles: {type: array, items: {type: string}, maxItems: 20}
                knowledge_key: {type: string, minLength: 1, maxLength: 120}
                content_base64: {type: string, minLength: 1}
                catalog_currency: {type: [string, "null"]}
                language: {type: string, default: zh-CN}
      responses:
        "201":
          description: 已入库（DRAFT）
          content:
            application/json:
              schema:
                $ref: "../schema/document_upload_result.json"
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: knowledge_key 重复（不覆盖、不新建版本）
          content:
            application/json:
              schema: {$ref: "../schema/error.json"}
        "413":
          description: 正文或请求体超限
          content:
            application/json:
              schema: {$ref: "../schema/error.json"}
        "422": {$ref: "#/components/responses/ValidationError"}
    get:
      tags: [knowledge]
      summary: 文档列表（审核用，含未检索状态）
      description: >-
        需要 `knowledge.read`（**文档管理元数据读取**，不授予正文/切片/检索权限）。
        顺序固定：限定租户 → 取每个文档的最新版本 → 校验数据范围并应用 status/domain 过滤 → 排序分页。
        最新版本不可见或状态不匹配时**整条文档消失，不回退旧版本**。
        `classification` / `audience` 等既有硬边界不因该接口而放宽。
        `offset` 只保证静态数据下稳定，不承诺并发更新时跨页快照一致。
      security: [{bearerAuth: []}]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [RAW, DRAFT, REVIEWED, APPROVED_INTERNAL, PUBLISHED_PUBLIC, SUPERSEDED, REVOKED, DISCARDED]
        - name: domain
          in: query
          schema:
            type: string
            enum: [owner_experience, glass_materials, production_process, product_catalog,
                   quality, equipment_safety, foreign_trade, training]
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: 最新版本列表
          content:
            application/json:
              schema:
                $ref: "../schema/document_list.json"
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /v1/training/assignments/{assignment_id}/content:
    get:
      tags: [training]
      summary: 读取课程正文本（分页）
      description: >-
        需要 `learner`，且任务必须属于令牌主体（他人任务与不存在任务同码 403）。
        可见性是**交集**：课程 PUBLISHED、版本属于该课程源、内部身份、audience=internal、
        status=APPROVED_INTERNAL、required_scope 被 allowed_scopes 覆盖、块 ACL 允许；
        父块仅在其**全部子块**均通过 ACL 时返回全文。
        源版本一旦进入禁止状态（撤销/弃用/待复核），整个请求 409，不返回残缺课程；
        分级 C3+ 暂无学员授权口径，同样整课 409。
        `cursor` 为服务端签名（HMAC），绑定租户/主体/任务/课程修订与位置，
        篡改、跨主体或跨任务复用、过期均返回 409；每页重新校验，旧游标不保留撤销前的读取资格。
        每次成功读取落一条审计（主体、任务、课程修订、返回的版本与块），不记正文与游标。
      security: [{bearerAuth: []}]
      parameters:
        - name: assignment_id
          in: path
          required: true
          schema: {type: string}
        - name: cursor
          in: query
          required: false
          schema: {type: string}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 20, default: 5}
      responses:
        "200":
          description: 当前页的正文本
          content:
            application/json:
              schema: {$ref: "../schema/training_content.json"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: 课程/源版本不可用，或游标不可信
          content:
            application/json:
              schema: {$ref: "../schema/error.json"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /v1/interviews/consents:
    post:
      tags: [interview]
      summary: 登记录音授权（仅本人）
      description: >-
        ADR-05 未签前的保守实现：只允许受访者本人授权（`granted_by` 由服务端写成 subject 本身），
        代授权一律拒绝；保留期必填且上限 3650 天。返回 consent_id。
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subject_id, method, retention_days]
              properties:
                subject_id: {type: string, minLength: 1, maxLength: 200}
                method: {type: string, enum: [ORAL_WITH_RECEIPT, WRITTEN]}
                retention_days: {type: integer, minimum: 1, maximum: 3650}
                receipt_uri: {type: string, maxLength: 500}
      responses:
        "201":
          description: 授权已登记
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [consent_id]
                properties:
                  consent_id: {type: string, format: uuid}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /v1/interviews/consents/{consent_id}/revoke:
    post:
      tags: [interview]
      summary: 撤回录音授权
      description: >-
        撤回即生效：删除该授权下所有转写、把草稿置为 WITHDRAWN（保留行与证据位供审计）、
        访谈转 WITHDRAWN；此后该授权不能再建访谈。
      security: [{bearerAuth: []}]
      parameters:
        - name: consent_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: {type: string, maxLength: 500}
      responses:
        "200":
          description: 撤回结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [consent_id, interviews, transcripts_deleted, drafts_withdrawn]
                properties:
                  consent_id: {type: string, format: uuid}
                  interviews: {type: integer}
                  transcripts_deleted: {type: integer}
                  drafts_withdrawn: {type: integer}
                  reason: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /v1/interviews/{interview_id}/transcript:
    post:
      tags: [interview]
      summary: 登记转写（RAW，任何检索路径不可见）
      description: >-
        转写只写 `interview_transcripts`，**不进入 knowledge_chunks**，
        因此检索与问答都看不到；内容按 `[mm:ss]` 行解析为带时间戳证据位。
      security: [{bearerAuth: []}]
      parameters:
        - name: interview_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content: {type: string, minLength: 1, maxLength: 200000}
                kind: {type: string, enum: [MACHINE, HUMAN_EDITED], default: MACHINE}
      responses:
        "201":
          description: 转写登记结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [transcript_id]
                properties:
                  transcript_id: {type: string, format: uuid}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /v1/interviews/{interview_id}/drafts:
    post:
      tags: [interview]
      summary: 生成带时间戳的草稿
      description: >-
        只做结构化，不做模型总结（ADR-05 未签）：按 `[mm:ss]` 段落抽取结论、
        条件、例外、风险与证据位，落 `experience_drafts` 待人工审核。
      security: [{bearerAuth: []}]
      parameters:
        - name: interview_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "201":
          description: 草稿已生成
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [draft_id]
                properties:
                  draft_id: {type: string, format: uuid}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}

  /v1/interviews/drafts/{draft_id}/review:
    post:
      tags: [interview]
      summary: 人工审核经验草稿
      description: >-
        需要 `interview.review`；审核人取自令牌 `sub`，AI 不得自我批准。
        APPROVE → APPROVED，REJECT → REJECTED；两者都会更新访谈状态。
      security: [{bearerAuth: []}]
      parameters:
        - name: draft_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: {type: string, enum: [APPROVE, REJECT]}
                note: {type: string, maxLength: 1000}
      responses:
        "200":
          description: 审核结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [draft_id, status, reviewer]
                properties:
                  draft_id: {type: string, format: uuid}
                  status: {type: string, enum: [APPROVED, REJECTED]}
                  reviewer: {type: string}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /v1/interviews/drafts/{draft_id}/promote:
    post:
      tags: [interview]
      summary: 把已批准草稿晋升为知识草稿
      description: >-
        需要 `knowledge.write`，且 `required_scope` 必须在调用者授权范围内。
        只有 `APPROVED` 且授权未撤回的草稿可晋升；晋升结果是一个 **DRAFT 版本**，
        后续仍需技术审核（必要时还要公开审批）才会被检索到。
        晋升会记录 `promoted_version_id`；撤回授权时该版本被置为 `REVOKED` 并写 outbox。
      security: [{bearerAuth: []}]
      parameters:
        - name: draft_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                domain:
                  type: string
                  enum: [owner_experience, quality, training]
                  default: owner_experience
                required_scope:
                  type: string
                  enum: [internal_product, internal_training]
                  default: internal_product
                classification: {type: integer, minimum: 0, maximum: 2, default: 1}
      responses:
        "201":
          description: 已晋升为知识草稿
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [draft_id, document_id, version_id, status]
                properties:
                  draft_id: {type: string, format: uuid}
                  document_id: {type: string, format: uuid}
                  version_id: {type: string, format: uuid}
                  status: {type: string, enum: [DRAFT]}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /v1/config/domains:
    get:
      tags: [config]
      summary: 列出本实例的知识域清单
      description: >-
        域是**实例级配置**（ADR-009）：用于组织、展示与过滤，不参与授权与可见性；
        可见性仍由 status / audience / required_scope / ACL 决定。
        租户取自认证上下文。
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: 本实例已登记的域
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [domains]
                properties:
                  domains:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [code, label, is_active, is_default]
                      properties:
                        code: {type: string, pattern: "^[a-z][a-z0-9_]{1,63}$"}
                        label: {type: string}
                        is_active: {type: boolean}
                        is_default: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [config]
      summary: 登记新的知识域（幂等）
      description: >-
        需要 `knowledge.write`——含义是"拥有知识写权限的人可以向本实例的共享分类清单追加域"。
        幂等语义：首次创建 201；相同 code + 相同 label 重试 200；相同 code + 不同 label 409（不静默改名）。
        本轮不提供改名/停用/删除（生命周期策略暂不纳入本片）。
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, label]
              properties:
                code: {type: string, minLength: 2, maxLength: 64,
                       pattern: "^[a-z][a-z0-9_]{1,63}$"}
                label: {type: string, minLength: 1, maxLength: 120}
      responses:
        "201":
          description: 已登记（或已存在且一致）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [code, label, outcome, created]
                properties:
                  code: {type: string}
                  label: {type: string}
                  outcome: {type: string, enum: [CREATED, EXISTS]}
                  created: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}

  /v1/config/catalog-rules:
    get:
      tags: [config]
      summary: 读取本实例的目录规则（货号正则 + 允许货币）
      description: >-
        目录规则是实例（租户）级配置：货号用 `fullmatch` 语义匹配；货币集合限定可入库的报价货币。
        **未配置时目录入库会被拒绝**（可识别的配置错误），但已有目录的读取与作答不受影响。
        租户取自认证上下文。
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: 当前规则（未配置时 configured=false、rule=null）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [configured, rule]
                properties:
                  configured: {type: boolean}
                  rule:
                    type: ["object", "null"]
                    additionalProperties: false
                    required: [code_pattern, currencies]
                    properties:
                      code_pattern: {type: string, maxLength: 200}
                      currencies:
                        type: array
                        minItems: 1
                        items: {type: string, pattern: "^[A-Z]{3}$"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      tags: [config]
      summary: 整体替换目录规则（幂等，带审计）
      description: >-
        需要 `knowledge.write`。相同内容重复 PUT 视为无变更（`changed=false`，不产生审计版本）。
        收紧规则若使存量货号或货币失效则返回 409（先处置数据）。每次实际变更写一条
        `catalog_rule_revisions`（操作者、时间、前后规则）。
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code_pattern, currencies]
              properties:
                code_pattern: {type: string, minLength: 2, maxLength: 200}
                currencies:
                  type: array
                  minItems: 1
                  items: {type: string, pattern: "^[A-Z]{3}$"}
                note: {type: ["string", "null"], maxLength: 200}
      responses:
        "200":
          description: 规则已生效
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [configured, changed, rule, warnings]
                properties:
                  configured: {type: boolean}
                  changed: {type: boolean}
                  rule:
                    type: object
                    additionalProperties: false
                    required: [code_pattern, currencies]
                    properties:
                      code_pattern: {type: string}
                      currencies:
                        type: array
                        items: {type: string}
                  warnings:
                    type: array
                    description: 保存提示（不阻断）；例如规则过宽会提示可能误识别数量/订单号
                    items: {type: string}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationError"}

components:
  schemas:
    EvidenceResponse:
      $ref: "../schema/evidence_response.json"
    SearchResponse:
      $ref: "../schema/search_response.json"
    CatalogConflictList:
      $ref: "../schema/catalog_conflict_list.json"
    CatalogConflictGroup:
      $ref: "../schema/catalog_conflict_group.json"
    DocumentList:
      $ref: "../schema/document_list.json"
    DocumentUploadResult:
      $ref: "../schema/document_upload_result.json"
    TrainingContentPage:
      $ref: "../schema/training_content.json"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
    KnowledgeId:
      name: knowledge_id
      in: path
      required: true
      schema: { type: string }
  responses:
    Unauthenticated:
      description: 缺少或无效令牌
      content:
        application/json:
          schema: { $ref: "../schema/error.json" }
    Forbidden:
      description: 已认证但无权限；不泄露资源是否存在
      content:
        application/json:
          schema: { $ref: "../schema/error.json" }
    ValidationError:
      description: 请求体不符合契约
      content:
        application/json:
          schema: { $ref: "../schema/error.json" }
    NotImplemented:
      description: 该能力属于后续阶段
      content:
        application/json:
          schema: { $ref: "../schema/error.json" }
    ServiceUnavailable:
      description: 依赖未配置或不可用（例如检索审计密钥缺失）
      content:
        application/json:
          schema: { $ref: "../schema/error.json" }
