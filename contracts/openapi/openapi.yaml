openapi: 3.1.0
info:
  title: Factory Knowledge Hub · knowledge-api
  version: 0.1.0
  description: |
    受控知识治理与可引用 RAG 服务契约（L1 Rev.2 §6.2 / §13.5）。

    通用约束：
    - 所有端点要求 `Authorization: Bearer <OIDC JWT>`，服务端校验 issuer / audience / exp / 签名。
    - `tenant_id`、`principal_id`、`roles` 只从令牌解析，不接受请求体或查询参数覆盖。
    - 写接口要求 `Idempotency-Key`；并发更新使用 `If-Match` 携带版本号。
    - 403 不区分"资源不存在"与"无权限"，避免用于探测资源存在性。
    - 所有错误响应统一为 Error 结构，并携带 trace_id。

    实现状态（Phase 0）：健康探针与认证已可用；业务端点已注册但返回 501，
    检索链路在 Phase 2、培训问答在 Phase 3 接入。
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: health
  - name: knowledge
  - name: evidence
  - name: training
  - name: ops
paths:
  /health/live:
    get:
      tags: [health]
      summary: 存活探针
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string }
                  version: { type: string }
  /health/ready:
    get:
      tags: [health]
      summary: 依赖就绪探针
      security: []
      responses:
        "200":
          description: 依赖就绪
        "503":
          description: 依赖未就绪（数据库未配置或不可达）

  /v1/sources:
    post:
      tags: [ops]
      summary: 申请上传与导入
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_type, filename, sha256]
              properties:
                source_type: { type: string, enum: [document, audio] }
                filename: { type: string, minLength: 1 }
                sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                expected_domain:
                  type: string
                  enum: [owner_experience, glass_materials, production_process, product_catalog, quality, equipment_safety, foreign_trade, training]
      responses:
        "201": { description: 已创建上传凭据 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /v1/interviews:
    post:
      tags: [knowledge]
      summary: 建立语音访谈任务
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [interviewee_subject, consent_record_id]
              properties:
                interviewee_subject: { type: string }
                consent_record_id: { type: string }
                topic: { type: string }
      responses:
        "201": { description: 访谈任务已建立 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /v1/interviews/{interview_id}:
    get:
      tags: [knowledge]
      summary: 查询转写与草稿状态
      parameters:
        - name: interview_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: 转写与草稿状态 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /v1/knowledge/drafts:
    post:
      tags: [knowledge]
      summary: 创建知识草稿
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [knowledge_key, domain, title, classification, audience]
              properties:
                knowledge_key: { type: string }
                domain:
                  type: string
                  enum: [owner_experience, glass_materials, production_process, product_catalog, quality, equipment_safety, foreign_trade, training]
                title: { type: string }
                classification: { type: integer, minimum: 0, maximum: 4 }
                audience: { type: string, enum: [internal, customer_public] }
      responses:
        "201": { description: 草稿已创建 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /v1/knowledge/{knowledge_id}/review:
    post:
      tags: [knowledge]
      summary: 技术审核
      description: |
        PASS 提交审核（DRAFT→REVIEWED）；APPROVE_INTERNAL 批准内部可用（REVIEWED→APPROVED_INTERNAL）；
        REJECT 退回草稿（REVIEWED/APPROVED_INTERNAL→DRAFT，同时清空审批人）。
      parameters:
        - $ref: "#/components/parameters/KnowledgeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [PASS, REJECT, APPROVE_INTERNAL] }
                reason: { type: [string, "null"], maxLength: 500 }
      responses:
        "200": { description: 审核结果与新状态 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 当前状态不允许该操作 }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/knowledge/{knowledge_id}/publish:
    post:
      tags: [knowledge]
      summary: 内部或对外发布
      description: |
        audience=internal：REVIEWED→APPROVED_INTERNAL；已批准则为幂等操作。
        audience=customer_public：需要 knowledge.publish_public 权限，要求 C0 + customer_public，
        且公开审批人必须区别于技术审批人——审批人取自令牌，请求体无法指定。
      parameters:
        - $ref: "#/components/parameters/KnowledgeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [audience]
              properties:
                audience: { type: string, enum: [internal, customer_public] }
                reason: { type: [string, "null"], maxLength: 500 }
      responses:
        "200": { description: 发布结果与新状态 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 状态不符或双签主体相同 }
        "422": { $ref: "#/components/responses/ValidationError" }

  /v1/knowledge/{knowledge_id}/revoke:
    post:
      tags: [knowledge]
      summary: 同步撤销授权与发布
      description: 撤销立即生效：状态一改，后续读取即拒绝该版本，不等索引异步清理。
      parameters:
        - $ref: "#/components/parameters/KnowledgeId"
        - name: reason
          in: query
          required: false
          schema: { type: string, maxLength: 500 }
      responses:
        "200": { description: 已撤销 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 版本已撤销或状态不允许撤销 }

  /v1/knowledge/search:
    post:
      tags: [knowledge]
      summary: 权限过滤检索
      description: >-
        默认词法检索（cjk-char-v1 字级 **OR** 召回 + ts_rank_cd 排序；2026-11-04 起查询构造
        由逐字 AND 改为 OR，同一评测集 recall@10 从 0.06 提升到 0.68）；服务端可用
        FKH_RETRIEVAL_MODE=hybrid 启用「向量 + 词法 RRF 融合」（向量由本地 BGE-M3 生成，
        不调用任何外部服务），召回模式不是请求参数，客户端只能从响应 scoring 观察。
        scoring 取值集合为 lexical-v2 | hybrid-rrf-v1（lexical-v1 为 2026-11-04 之前的历史取值，
        不再返回）：按旧 const 校验的调用方必须放宽断言——这是**有意的破坏性契约变更**。
        max_results 是返回上限，不保证填满：候选窗口内被 ACL 拒绝的条数越多，返回越少。
        空结果与「都无权限」不可区分（同为 200 + 空数组），但缺少接口权限或范围未授权仍返回 403。
        显式启用混合但模型未安装/权重缺失/推理失败时返回 503，不静默降级成词法结果。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query, knowledge_scope]
              properties:
                query: { type: string, minLength: 1, maxLength: 2000 }
                knowledge_scope: { type: string, enum: [customer_public, internal_training, internal_product] }
                max_results: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: 已按 ACL 过滤的候选片段
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /v1/knowledge/context:
    post:
      tags: [knowledge]
      summary: 检索并组装生成用上下文（内部端点）
      description: |
        问答链路的前置步骤，不对外承诺。
        每一块都经过 ACL 判定；父块仅在其下全部子块均可见时整段返回，否则退回子块原文。
        必须经过检索审计，权限与 /v1/knowledge/search 相同。
        召回来源**固定为词法**（2026-11-04 判决 Q7）：候选来源变化会改变拒答分档
        （NO_EVIDENCE / INSUFFICIENT_EVIDENCE / HUMAN_REVIEW_REQUIRED），
        即使 search 已启用混合，本端点也不跟随；接混合须另行送审。
      x-internal: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query, knowledge_scope]
              properties:
                query: { type: string, minLength: 1, maxLength: 2000 }
                knowledge_scope:
                  type: string
                  enum: [customer_public, internal_training, internal_product]
                max_results: { type: integer, minimum: 1, maximum: 50, default: 10 }
                max_blocks: { type: integer, minimum: 1, maximum: 20, default: 8 }
                max_tokens: { type: integer, minimum: 500, maximum: 20000, default: 6000 }
      responses:
        "200": { description: 上下文块与统计（denied / dropped / parent_restores） }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { description: 检索审计未配置 }

  /v1/knowledge/answer:
    post:
      tags: [knowledge]
      summary: 带引用问答
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schema/answer_request.json"
      responses:
        "200":
          description: 回答、拒答或转人工
          content:
            application/json:
              schema:
                $ref: "../schema/answer_response.json"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /v1/evidence/{evidence_id}:
    get:
      tags: [evidence]
      summary: 受控证据定位
      description: >-
        返回受控证据的定位与正文。ADR-01 未签署、无对象存储，本版本固定返回
        signed_url=null 与 signed_url_state=NOT_CONFIGURED：定位能力可用，签名链接能力未交付。
        不存在、跨租户、状态不可见、scope 不符、ACL 拒绝一律 403，body 不携带资源元数据。
      parameters:
        - name: evidence_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 证据定位与正文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/feedback:
    post:
      tags: [knowledge]
      summary: 反馈与坏例登记
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [trace_id, category, expected_behavior]
              properties:
                trace_id: { type: string }
                category: { type: string }
                expected_behavior: { type: object }
      responses:
        "201": { description: 已登记坏例 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /v1/training/courses:
    post:
      tags: [training]
      summary: 创建课程草稿
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role_code, role_name, title]
              properties:
                role_code: { type: string, minLength: 1, maxLength: 64 }
                role_name: { type: string, minLength: 1, maxLength: 128 }
                title: { type: string, minLength: 1, maxLength: 200 }
                knowledge_version_ids:
                  type: array
                  maxItems: 20
                  items: { type: string }
      responses:
        "200": { description: 课程草稿（status=DRAFT） }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 业务规则不满足 }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/training/courses/{course_id}/questions:
    post:
      tags: [training]
      summary: 新增题目（内部端点）
      description: 题目绑定创建时的课程版本；同一版本内题目不可变。
      x-internal: true
      parameters:
        - name: course_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [question_type, prompt]
              properties:
                question_type:
                  type: string
                  enum: [SINGLE_CHOICE, MULTI_CHOICE, TRUE_FALSE, SHORT_ANSWER]
                prompt: { type: string, minLength: 1, maxLength: 1000 }
                answer_key: { type: object }
                evidence_refs:
                  type: array
                  maxItems: 10
                  items: { type: object }
                status: { type: string, enum: [DRAFT, APPROVED], default: APPROVED }
      responses:
        "200": { description: 题目已创建 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 课程不存在或状态不允许 }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/training/courses/{course_id}/publish:
    post:
      tags: [training]
      summary: 发布课程
      description: |
        必须绑定至少一个已审批知识版本（数据库触发器强制）；存在草稿题目时拒绝。
        发布时 version 自增、published_at 由数据库填写。
      parameters:
        - name: course_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: 已发布 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 缺少知识源、源未审批或存在草稿题目 }
  /v1/training/assignments:
    post:
      tags: [training]
      summary: 按岗位分配课程
      description: 只有已发布课程可分配；同一课程对同一学员重复分配返回既有任务。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [course_id, learner_subject_id]
              properties:
                course_id: { type: string }
                learner_subject_id: { type: string, minLength: 1, maxLength: 200 }
                cohort_id: { type: [string, "null"], maxLength: 64 }
      responses:
        "200": { description: 分配结果 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 课程未发布或不存在 }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/training/me/assignments:
    get:
      tags: [training]
      summary: 查询本人学习任务
      description: 学员身份取自令牌，不接受查询参数指定他人。
      responses:
        "200": { description: 本人任务列表 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/training/ask:
    post:
      tags: [training]
      summary: 培训带引用问答
      description: 服务端由 assignment 反查租户、课程版本与知识白名单，不接受请求自带权限字段。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assignment_id, question, language]
              properties:
                assignment_id: { type: string }
                question: { type: string, minLength: 1, maxLength: 2000 }
                language: { type: string, enum: [zh-CN, en-US] }
      responses:
        "200":
          description: 回答，结构同 AnswerResponse 并附带 assignment_id 与 course_version
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [status, answer, citations, trace_id, assignment_id, course_version]
                properties:
                  assignment_id: { type: string }
                  course_version: { type: integer, minimum: 1 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /v1/training/attempts:
    post:
      tags: [training]
      summary: 提交测验
      description: |
        服务端按已审批题库版本判分，请求体不含分数字段（多传即 422）。
        幂等键重复提交返回既有成绩，不重复判分。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assignment_id, responses, idempotency_key]
              properties:
                assignment_id: { type: string }
                responses: { type: object }
                idempotency_key: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200": { description: 判分结果 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 非本人任务或任务不存在 }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/training/practical-signoffs:
    post:
      tags: [training]
      summary: 人工实操签核
      description: 校验导师与班组授权；签核人不得是当前学员本人。
      responses:
        "201": { description: 已签核 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /v1/training/feedback:
    post:
      tags: [training]
      summary: 形成受控坏例及课程反馈
      responses:
        "201": { description: 已登记 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /v1/training/assignments/{assignment_id}/progress:
    get:
      tags: [training]
      summary: 学习进度
      description: 只能查本人任务；他人任务与不存在同样返回 403。
      parameters:
        - name: assignment_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: 进度详情 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  schemas:
    EvidenceResponse:
      $ref: "../schema/evidence_response.json"
    SearchResponse:
      $ref: "../schema/search_response.json"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
    KnowledgeId:
      name: knowledge_id
      in: path
      required: true
      schema: { type: string }
  responses:
    Unauthenticated:
      description: 缺少或无效令牌
      content:
        application/json:
          schema: { $ref: "../schema/error.json" }
    Forbidden:
      description: 已认证但无权限；不泄露资源是否存在
      content:
        application/json:
          schema: { $ref: "../schema/error.json" }
    ValidationError:
      description: 请求体不符合契约
      content:
        application/json:
