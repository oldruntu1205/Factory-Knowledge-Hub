[project]
name = "factory-knowledge-hub"
version = "0.1.0"
description = "Factory Knowledge Hub — 制造业 AI 企业知识中枢（受控知识治理 + 可引用 RAG）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary,pool]>=3.2.3",
    "pyjwt[crypto]>=2.9.0",
    "jsonschema>=4.23.0",
    "pyyaml>=6.0.2",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fkh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "requires_pg: 需要可用的 PostgreSQL（含 pgvector）实例，缺失时跳过并显式报告",
    "contract: 契约一致性测试",
    "security: 权限与数据隔离测试",
    "slow: 慢速测试",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]
