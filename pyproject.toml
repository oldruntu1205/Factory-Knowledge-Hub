[project]
name = "factory-knowledge-hub"
version = "0.1.0"
description = "Factory Knowledge Hub — 制造业 AI 企业知识中枢（受控知识治理 + 可引用 RAG）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary,pool]>=3.2.3",
    "pyjwt[crypto]>=2.9.0",
    "jsonschema>=4.23.0",
    "pyyaml>=6.0.2",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "markdown-it-py>=4.2.0",
]

# 向量能力按需安装：torch 与模型权重体积大，默认安装不含它们。
# 未安装时 embedding_provider 只能取 none/test，构造 bge-m3 会给出明确错误。
[project.optional-dependencies]
embedding = [
    "sentence-transformers>=3.0.0",
    "torch>=2.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    # 本地无 Docker/系统 PG 时由 conftest 起内嵌实例；CI 用外部 service 时不生效。
    # 显式声明，避免 `uv sync` 把它当成未登记包剪掉。
    "pgserver>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fkh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "requires_pg: 需要可用的 PostgreSQL（含 pgvector）实例，缺失时跳过并显式报告",
    "contract: 契约一致性测试",
    "security: 权限与数据隔离测试",
    "slow: 慢速测试",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]

# 可选依赖（torch / sentence-transformers）不带类型存根。
# 它们只在 embedding_provider=bge-m3 时被延迟导入，缺失不影响默认安装。
[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "torch.*"]
ignore_missing_imports = true
